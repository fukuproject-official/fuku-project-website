<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>福プロジェクト｜管理画面</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/editor.js"></script></head><body><header><a class="brand" href="/">FUKU PROJECT <small>サイト管理</small></a><a href="/" target="_blank" rel="noopener">公開サイトを見る</a><button id="logout" hidden>ログアウト</button></header><main><section id="login" hidden><h1>おかえりなさい。</h1><p>管理者アカウントでログインしてください。</p><form id="login-form"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">ログイン</button></form></section><section id="workspace" hidden><div class="intro"><p class="eyebrow">YOUR WEBSITE, YOUR WORDS.</p><h1>福プロの今を、届けよう。</h1><p>写真や文章を編集して、プレビューで確認。最後に「公開」でサイトに反映します。</p></div><div id="connection" class="notice"></div><div class="toolbar"><span id="state">読み込み中…</span><button id="save">下書き保存</button><button id="preview">プレビュー</button><button class="primary" id="publish">公開する</button></div><div class="layout"><nav id="tabs" aria-label="編集する項目"></nav><section id="editor" aria-label="編集フォーム"></section></div></section><p id="status" role="status" aria-live="polite"></p></main><dialog id="publish-dialog"><h2>この内容を公開しますか？</h2><p>公開サイトを訪れるすべての人に反映されます。</p><p id="publish-summary"></p><div class="actions"><button id="cancel-publish">戻って確認</button><button class="primary" id="confirm-publish">この内容を公開</button></div></dialog></body></html>
