<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>福プロジェクト｜管理画面</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/editor.js"></script></head><body><header><a class="brand" href="/">FUKU PROJECT <small>サイト管理</small></a><a href="/" target="_blank" rel="noopener">公開サイトを見る</a><button id="logout" hidden>ログアウト</button></header><main><section id="login" hidden><h1>おかえりなさい。</h1><p>管理者アカウントでログインしてください。</p><form id="login-form"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">ログイン</button></form></section><section id="workspace" hidden><div id="connection" class="notice"></div><div class="toolbar"><button id="menu-toggle" aria-expanded="false" aria-controls="tabs">☰ メニュー</button><span id="state">読み込み中…</span><button id="save">下書き保存</button><button id="panel-toggle" aria-expanded="false" aria-controls="preview-panel">見え方</button><button id="preview">全画面で確認</button><button class="primary" id="publish">公開する</button></div><div class="layout"><nav id="tabs" aria-label="編集する項目"></nav><section id="editor" aria-label="編集フォーム"></section><aside id="preview-panel" hidden><h2>見え方</h2><label>表示幅<select id="preview-size"><option value="pc">PC</option><option value="phone">スマホ</option></select></label><div id="preview-content"></div><p class="hint">正確なレイアウトは「全画面で確認」で確認できます。</p></aside></div><button id="export-draft">変更内容をファイルに控える</button></section><p id="status" role="status" aria-live="polite"></p></main><dialog id="publish-dialog"><h2>この内容を公開しますか？</h2><p>公開サイトを訪れるすべての人に反映されます。</p><p id="publish-summary"></p><div class="actions"><button id="cancel-publish">戻って確認</button><button class="primary" id="confirm-publish">この内容を公開</button></div></dialog></body></html>
